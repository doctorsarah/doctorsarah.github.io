<!DOCTYPE html>
<html>

<head>
    <title>Poem</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: pink;
        }

        strong {
            color: red;
        }

        em {
            color: blue;
        }
    </style>
</head>

<body>
    <p>Roses are <strong>red</strong>
        Violets are <em>blue</em> <br />
        This poem doesn't rhyme<br />
        But I like you anyhow.</p>
</body>

</html>
