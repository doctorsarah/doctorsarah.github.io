<!DOCTYPE html>
<html>

<head>
    <title>Poem</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .pink {
            background-color: rgb(245, 210, 246);
        }

        .white {
            background-color: #ffffff;
        }

        .red {
            color: red;
        }

        .blue {
            color: blue;
        }
    </style>
</head>

<body class="pink">
    <p class="white">Roses are <strong class="red pink">red</strong>
        Violets are <em class="blue pink">blue</em> <br />
        This poem doesn't rhyme<br />
        But I like you anyhow.</p>
</body>

</html>
