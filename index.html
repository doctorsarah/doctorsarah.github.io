<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Demos</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background: #fafafa;
    color: #333;
}

h1 {
    text-align: center;
    color: #b22222;
}

.page-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 30px;
}

.page-list a {
    display: block;
    text-decoration: none;
    padding: 15px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
    color: #333;
    font-weight: 600;
    transition: all 0.2s;
}

.page-list a:hover {
    background: #b22222;
    color: white;
    transform: translateY(-2px);
}
</style>
</head>
<body>
